[package]
name = "readback-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Readback check engine: decodes an agent payment request and returns CLEARED, HOLD or REFUSED"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "readback-check"
path = "src/bin/readback-check.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.11"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
