name: engine

on:
  push:
    paths: ["engine/**", "docs/test-vectors/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "docs/test-vectors/**", ".github/workflows/engine.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the WASI target
        run: rustup show active-toolchain   # installs the version pinned in engine/rust-toolchain.toml
      - name: Unit, vector and robustness tests
        run: cargo test --locked
      - name: Build the enclave module
        run: cargo build --locked --release --target wasm32-wasip1
      - name: Install wasmtime 25.0.3
        run: |
          curl -sSfL -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v25.0.3/wasmtime-v25.0.3-x86_64-linux.tar.xz
          tar -xf wasmtime.tar.xz && echo "$PWD/wasmtime-v25.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - name: WASI module matches native on every vector, within 1e9 fuel
        run: RB_WASM=target/wasm32-wasip1/release/readback-check.wasm cargo test --locked --test vectors wasm -- --nocapture
      - name: WASI P2 module (what OutLayer runs) matches native on every vector
        run: cargo build --locked --release --target wasm32-wasip2 && RB_WASM=target/wasm32-wasip2/release/readback-check.wasm cargo test --locked --test vectors wasm -- --nocapture
      - name: The P2 module is the one deployed to OutLayer, byte for byte
        run: |
          sha256sum target/wasm32-wasip2/release/readback-check.wasm
          test "$(sha256sum target/wasm32-wasip2/release/readback-check.wasm | cut -d" " -f1)" = 89a21ea9327a39899e44d60de66caa6d9ab2845f695ffe5f7489fbdb431e5d69
